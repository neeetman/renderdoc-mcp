[project]
name = "renderdoc-mcp"
version = "0.1.0"
description = "RenderDoc frame capture and headless analysis as an MCP server, for agents"
readme = "README.md"
# renderdoc.pyd is built against one Python minor version (build_renderdoc.ps1 -PythonMinor)
requires-python = ">=3.10,<3.11"
dependencies = ["mcp>=1.2,<2"]  # v1 FastMCP API (2.x renamed it to MCPServer)

[project.scripts]
renderdoc-mcp = "renderdoc_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renderdoc_mcp"]
